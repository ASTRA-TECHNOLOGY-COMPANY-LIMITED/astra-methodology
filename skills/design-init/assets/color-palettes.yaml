# Primary color palette lookup for /design-init Step 3.
# Each family provides 11 shades (50, 100, 200, ..., 900, 950) in OKLCH.
# Used to populate DESIGN.md Front Matter tokens.color.primitive.primary.*
# when user selects a Primary color family.
#
# Tailwind v3 color curves adapted to OKLCH (perceptually uniform).
# DO NOT hand-tune lightness values — they follow a consistent perceptual curve.

